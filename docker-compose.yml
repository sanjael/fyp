version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ragguard_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragguard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragguard_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-ragguard_tr}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragguard_admin} -d ${POSTGRES_DB:-ragguard_tr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ragguard_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: ragguard_chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/heartbeat\")'"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: ragguard_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Note: On Windows with WSL2, you might need to run Ollama on the host machine to access the GPU effectively.
    # If running inside docker, it will use CPU by default unless configured for GPU.
    
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragguard_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ragguard_admin}:${POSTGRES_PASSWORD:-ragguard_secure_password}@postgres:5432/${POSTGRES_DB:-ragguard_tr}
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - EVALUATOR_PROVIDER=${EVALUATOR_PROVIDER:-google}
      - EVALUATOR_LLM_MODEL=${EVALUATOR_LLM_MODEL:-gemini-2.5-flash}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    restart: unless-stopped

  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragguard_celery
    command: celery -A app.core.celery_app worker --loglevel=info -Q ingestion,benchmark,evaluation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ragguard_admin}:${POSTGRES_PASSWORD:-ragguard_secure_password}@postgres:5432/${POSTGRES_DB:-ragguard_tr}
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - EVALUATOR_PROVIDER=${EVALUATOR_PROVIDER:-google}
      - EVALUATOR_LLM_MODEL=${EVALUATOR_LLM_MODEL:-gemini-2.5-flash}
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragguard_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ragguard_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ragguard_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  prometheus_data:
  grafana_data:
