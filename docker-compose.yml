version: '3.8'

services:
  ragguard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CHROMA_HOST=localhost
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./backend/app/chroma:/app/backend/app/chroma
      - ./backend/app/uploads:/app/backend/app/uploads
    restart: unless-stopped
